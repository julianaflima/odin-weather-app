<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Weather App</title>

</head>
<body>
	<div class="header">
		<form autocomplete="off">
			<input type="text" placeholder="Search city" name="city" id="city-input">
		<!-- Id result from example -->
			<div class="results"> 
				<ul class="autocomplete-list">
				</ul>
			</div>
		</form>
		<!-- Rounded switch -->
		  <div class="switch-container">
		  	<span>&deg;C</span>
		    <input type="checkbox" id="selected-unit">
			<label for="selected-unit" class="toggle"></label>
			<span>&deg;F</span>
		  </div>
	</div>
</body>
</html>
